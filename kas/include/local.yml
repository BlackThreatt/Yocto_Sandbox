header:
  version: 14

local_conf_header:
  standard: |
    CONF_VERSION = "2"
  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
  eula: |  # CHANGED
    ACCEPT_EULA_stm32mp25-disco = "0" # TODO: Make it dynamic according to MACHINE used
  yocto_environment_config: |
    DL_DIR = "/YoctoShare/downloads"
    SSTATE_DIR = "/YoctoShare/sstate-cache"
    BUILDDIR = "/work/build"
    TMPDIR = "/work/build/tmp"
    BBLAYERS_FETCH_DIR = "/work/layers"
  build_type: |
    BUILD_TYPE = "dev"
